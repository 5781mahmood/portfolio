<!doctype html>
<!-- Source for public/og-image.png; render command is in the README. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: hsl(36 28% 97%);
        color: hsl(24 18% 10%);
        font-family: "Source Sans 3", system-ui, sans-serif;
        padding: 84px 96px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border-left: 14px solid hsl(22 78% 34%);
      }
      .eyebrow { display: flex; align-items: center; gap: 18px; font-size: 26px; color: hsl(24 8% 36%); }
      .eyebrow span { width: 48px; height: 2px; background: hsl(22 78% 34%); }
      h1 { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 112px; letter-spacing: -0.02em; line-height: 1; margin-top: 34px; }
      .roles { margin-top: 30px; font-size: 38px; color: hsl(24 18% 10% / 0.82); }
      footer { display: flex; justify-content: space-between; align-items: baseline; border-top: 1.5px solid hsl(30 12% 84%); padding-top: 28px; font-size: 26px; color: hsl(24 8% 36%); }
      footer strong { color: hsl(22 78% 34%); font-weight: 600; }
    </style>
  </head>
  <body>
    <div>
      <p class="eyebrow"><span></span>University of Toronto Mississauga · TCS &amp; CCIT</p>
      <h1>Mahmood Sultan</h1>
      <p class="roles">Backend development · QA testing · UX research</p>
    </div>
    <footer>
      <strong>Seeking a 12–16 month co-op from May 2027</strong>
      <span>mahmoodsultan.com</span>
    </footer>
  </body>
</html>
